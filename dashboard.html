<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Student Monitoring System</title>
    <meta name="description" content="Role-based student monitoring workspace for administrators, teachers, and students.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="dashboard-overrides.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="dashboard.html"><span class="brand-mark">SM</span><span>Student<br><strong>Monitoring</strong></span></a>
            <div class="workspace-label">WORKSPACE</div>
            <nav id="side-nav" class="side-nav" aria-label="Workspace navigation"></nav>
           
        </aside>
        <main class="main-content">
            <header class="topbar">
                <button id="menu-button" class="icon-button menu-button" type="button" aria-label="Toggle navigation">☰</button>
                <div><p class="eyebrow" id="page-kicker">OVERVIEW</p><h1 id="page-title">Good morning</h1></div>
                <div class="topbar-actions"><button id="theme-button" class="icon-button" type="button" aria-label="Switch to dark theme" title="Switch theme">◐</button><button id="top-logout-button" class="top-logout" type="button">Sign out</button><div class="profile"><div class="avatar" id="profile-avatar">AD</div><div><strong id="profile-name">Administrator</strong><span id="profile-role">Admin account</span></div></div></div>
            </header>
            <div id="toast" class="toast" role="status" aria-live="polite"></div>
            <div id="app-view" class="app-view"></div>
        </main>
    </div>
    <dialog id="record-dialog">
        <form id="record-form" method="dialog">
            <div class="dialog-head"><div><p class="eyebrow" id="dialog-kicker">NEW RECORD</p><h2 id="dialog-title">Add record</h2></div><button class="icon-button" type="button" value="cancel" aria-label="Close dialog">×</button></div>
            <div id="form-fields" class="form-grid"></div>
            <div class="dialog-actions"><button class="button button-quiet" type="button" value="cancel">Cancel</button><button class="button" id="save-record" type="submit" value="default">Save record</button></div>
        </form>
    </dialog>
    <script type="module" src="assets/js/features/workspace/page.js"></script>
</body>
</html>
